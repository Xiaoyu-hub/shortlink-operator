# 本文件用模块插件的方式配置 golangci-lint。
# 执行 'make lint' 时，它会自动构建一个带下列所有插件的自定义 golangci-lint 二进制。
#
# 参见：https://golangci-lint.run/plugins/module-plugins/
version: v2.13.1
plugins:
  # logcheck 被检结构化日志调用及其参数（例如 key-value 是否成对）
  - module: "sigs.k8s.io/logtools"
    import: "sigs.k8s.io/logtools/logcheck/gclplugin"
    version: latest

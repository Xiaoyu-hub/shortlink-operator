---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: shortlinks.shortlink.dev
spec:
  group: shortlink.dev
  names:
    categories:
    - shortlink
    kind: Shortlink
    listKind: ShortlinkList
    plural: shortlinks
    shortNames:
    - sl
    singular: shortlink
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.readyReplicas
      name: Replicas
      type: integer
    - jsonPath: .metadata.generation
      name: Generation
      type: integer
    - jsonPath: .status.observedGeneration
      name: Observed
      type: integer
    - jsonPath: .status.url
      name: URL
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Shortlink 是长链转短链服务的声明式描述：写一个 Shortlink，
          控制器负责把 Deployment / Service 等一组底层资源收敛到该期望状态。

          printcolumn 让 `kubectl get shortlinks` / `kubectl get sl` 直接可读，
          不必每次 -o yaml 翻 status.conditions。
          Generation / Observed 成对显示，让「控制器是否已追上最新 spec」在 `kubectl get sl` 的默认视图里
          一眼可见——否则 Ready=True 可能是很久以前那版 spec 的结论（见 status 的因果链说明）。
          判读方式：Observed < Generation 即为未收敛（冻结 / 调和失败 / 还在处理途中都可能）。
          更精炼的替代方案是加一个 Synced 条件（Crossplane 的托管资源就是 Synced + Ready 双条件），
          但那是更大的改动，暂记为候选。
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Shortlink
            properties:
              autoscaling:
                description: |-
                  autoscaling 可选：声明后由 HPA 接管副本数伸缩。

                  与 spec.replicas **互斥**（由下方 CEL 规则在准入期静态拒绝）。启用后控制器的
                  写入集合与比较集合里都不再包含 Deployment 的 replicas——这份所有权让给 HPA；
                  否则两边会互相写、来回打（每次都是真写入 + 事件风暴）。
                  这是「多写者出现时，字段所有权必须重新划分」的第一个真实触发点。
                properties:
                  maxReplicas:
                    description: maxReplicas 是 HPA 的上限。
                    format: int32
                    minimum: 1
                    type: integer
                  minReplicas:
                    description: minReplicas 是 HPA 的下限；不写按 1 处理（与 HPA 自己的默认一致）。
                    format: int32
                    minimum: 1
                    type: integer
                  targetCPUUtilizationPercentage:
                    description: |-
                      targetCPUUtilizationPercentage 是所有 Pod 的平均 CPU 利用率目标。
                      这里**必填**（不是指针）：HPA 的 Utilization 指标类型必须有目标值，缺了会被 API Server
                      以 "must specify averageUtilization" 拒绝——与其让它在控制器运行时炸，不如让准入期就拦住。

                      注意：HPA 依赖**容器的 resources.requests.cpu** 才能算利用率——没有 requests 时
                      HPA 会报 "missing request for cpu" 而不伸缩（spec.resources 因此变成事实上的必填）。
                    format: int32
                    maximum: 100
                    minimum: 1
                    type: integer
                required:
                - maxReplicas
                - targetCPUUtilizationPercentage
                type: object
              baseDomain:
                description: |-
                  baseDomain 是短链域名（如 sh.example.com），用于拼接 status.url。
                  Pattern 是域名形态的粗校验，真正的 DNS 可用性只能靠运行时探测。
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
              env:
                description: |-
                  env 是追加到容器上的环境变量（同名覆盖镜像内置默认值）。
                  listType=map + listMapKey=name：以 name 为键做「合并」语义，
                  两个不同的控制器/用户各改一个变量时不会互相覆盖整张列表。
                items:
                  description: EnvVar represents an environment variable present in
                    a Container.
                  properties:
                    name:
                      description: |-
                        Name of the environment variable.
                        May consist of any printable ASCII characters except '='.
                      type: string
                    value:
                      description: |-
                        Variable references $(VAR_NAME) are expanded
                        using the previously defined environment variables in the container and
                        any service environment variables. If a variable cannot be resolved,
                        the reference in the input string will be unchanged. Double $$ are reduced
                        to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                        "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
                        Escaped references will never be expanded, regardless of whether the variable
                        exists or not.
                        Defaults to "".
                      type: string
                    valueFrom:
                      description: Source for the environment variable's value. Cannot
                        be used if value is not empty.
                      properties:
                        configMapKeyRef:
                          description: Selects a key of a ConfigMap.
                          properties:
                            key:
                              description: |-
                                The key to select from the ConfigMap's Data field.
                                Keys in the BinaryData field are not currently propagated to container env vars.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the ConfigMap or its key
                                must be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                        fieldRef:
                          description: |-
                            Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                            spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                          properties:
                            apiVersion:
                              description: Version of the schema the FieldPath is
                                written in terms of, defaults to "v1".
                              type: string
                            fieldPath:
                              description: Path of the field to select in the specified
                                API version.
                              type: string
                          required:
                          - fieldPath
                          type: object
                          x-kubernetes-map-type: atomic
                        fileKeyRef:
                          description: |-
                            FileKeyRef selects a key of the env file.
                            Requires the EnvFiles feature gate to be enabled.
                          properties:
                            key:
                              description: |-
                                The key within the env file. An invalid key will prevent the pod from starting.
                                The keys defined within a source may consist of any printable ASCII characters except '='.
                                During Alpha stage of the EnvFiles feature gate, the key size is limited to 128 characters.
                              type: string
                            optional:
                              default: false
                              description: |-
                                Specify whether the file or its key must be defined. If the file or key
                                does not exist, then the env var is not published.
                                If optional is set to true and the specified key does not exist,
                                the environment variable will not be set in the Pod's containers.

                                If optional is set to false and the specified key does not exist,
                                an error will be returned during Pod creation.
                              type: boolean
                            path:
                              description: |-
                                The path within the volume from which to select the file.
                                Must be relative and may not contain the '..' path or start with '..'.
                              type: string
                            volumeName:
                              description: The name of the volume mount containing
                                the env file.
                              type: string
                          required:
                          - key
                          - path
                          - volumeName
                          type: object
                          x-kubernetes-map-type: atomic
                        resourceFieldRef:
                          description: |-
                            Selects a resource of the container: only resources limits and requests
                            (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
                          properties:
                            containerName:
                              description: 'Container name: required for volumes,
                                optional for env vars'
                              type: string
                            divisor:
                              anyOf:
                              - type: integer
                              - type: string
                              description: Specifies the output format of the exposed
                                resources, defaults to "1"
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            resource:
                              description: 'Required: resource to select'
                              type: string
                          required:
                          - resource
                          type: object
                          x-kubernetes-map-type: atomic
                        secretKeyRef:
                          description: Selects a key of a secret in the pod's namespace
                          properties:
                            key:
                              description: The key of the secret to select from.  Must
                                be a valid secret key.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the Secret or its key must
                                be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                      type: object
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              image:
                description: |-
                  image 是短链服务容器镜像，唯一必填字段。
                  不给 default 是有意的：镜像版本属于用户意图，控制器不该替用户猜一个版本。
                minLength: 1
                type: string
              maxSurge:
                anyOf:
                - type: integer
                - type: string
                description: |-
                  maxSurge / maxUnavailable 控制滚动更新的节奏，语义与 Deployment 完全一致
                  （可写百分比 "25%" 或绝对数 1）。

                  刻意用指针且**不给 CRD 默认值**：nil 的语义是「本 operator 不声明这个字段」，
                  于是控制器既不写它、也不比较它，让 Deployment 自己的默认值（25%/25%）生效。
                  这与 replicas 的指针语义同源——必须区分「用户声明了」与「用户没声明」，
                  否则控制器会去和 API Server 的默认值较劲，形成永久偏移。
                x-kubernetes-int-or-string: true
              maxUnavailable:
                anyOf:
                - type: integer
                - type: string
                x-kubernetes-int-or-string: true
              paused:
                default: false
                description: paused 为 true 时控制器只维护 status、不再推进底层资源（故障演练/排障开关）。
                type: boolean
              port:
                default: 8080
                description: port 是容器监听端口，同时作为 Service 的目标端口。
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              replicas:
                description: |-
                  replicas 是期望的 Pod 副本数。
                  用 *int32 而不是 int32：Go 的零值 0 与「用户没写这个字段」无法区分，
                  而这两者语义完全不同（0 = 明确缩容到 0，未设置 = 用默认 1）。

                  刻意**不给 CRD 默认值**（早期版本给过 `+kubebuilder:default=1`，已移除）：
                  默认值会在准入时把 nil 填成 1，于是「用户到底有没有显式写过 replicas」这件事
                  在 API Server 侧永久丢失——既让指针失去意义，也让下面那条 CEL 互斥规则失效
                  （它需要 has(self.replicas) 来判断"用户是否声明过"）。
                  未设置时的默认 1 由控制器在 desiredReplicas 里兜底，行为不变。
                format: int32
                minimum: 0
                type: integer
              resources:
                description: resources 是容器资源诉求，直接复用 corev1 类型以避免自造轮子。
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              serviceType:
                default: ClusterIP
                description: |-
                  serviceType 决定 Service 如何暴露。
                  用 Enum 而不是自由字符串：非法值在 kubectl apply 那一刻就被 API Server 拒绝，
                  不会等到控制器调和时才炸。
                enum:
                - ClusterIP
                - NodePort
                - LoadBalancer
                type: string
            required:
            - image
            type: object
            x-kubernetes-validations:
            - message: replicas 与 autoscaling 互斥：启用 HPA 后副本数由 HPA 管理，请移除 replicas
              rule: '!(has(self.autoscaling) && has(self.replicas))'
          status:
            description: status defines the observed state of Shortlink
            properties:
              conditions:
                description: |-
                  conditions 是标准化的状态条件列表。
                  observedGeneration 写在每条 condition 上，使「这条结论对应哪一版 spec」可被工具链核对。
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  observedGeneration 是控制器最后一次完整处理的 spec 版本号（metadata.generation）。
                  只有它 == metadata.generation 时，上面的 conditions 才代表「最新 spec 已被处理完」；
                  否则说明控制器还没追上用户刚提交的改动。这是 spec/status 之间的因果链。
                format: int64
                type: integer
              readyReplicas:
                description: |-
                  readyReplicas 是 Deployment 当前 Ready 的副本数。
                  该值来自 API Server（Deployment.status.readyReplicas）的真实观测，
                  不是控制器本地计数——本地计数在重启/多副本 manager 下会漂。
                format: int32
                minimum: 0
                type: integer
              url:
                description: url 是短链服务的访问入口（ClusterIP 时为集群内地址，NodePort/LoadBalancer
                  时为对外地址）。
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}

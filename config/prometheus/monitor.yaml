# Prometheus 采集用的 ServiceMonitor（metrics）
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: shortlink-operator
    app.kubernetes.io/managed-by: kustomize
  name: controller-manager-metrics-monitor
  namespace: system
spec:
  endpoints:
    - path: /metrics
      port: https # 这里必须是暴露 HTTPS metrics 的那个端口名
      scheme: https
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        # TODO(user)：insecureSkipVerify: true 不建议用在生产，因为它关掉了
        # 证书校验，会把自己暴露在中间人攻击下。
        # 生产环境推荐用 cert-manager 自动管理 TLS 证书。
        # 要采用这种方式，先启用 cert-manager，再用 config/prometheus/servicemonitor_tls_patch.yaml
        # 里的 patch——它会安全地引用 'metrics-server-cert' 这个 secret 里的证书。
        insecureSkipVerify: true
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: shortlink-operator

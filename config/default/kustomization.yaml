# 给所有资源加上命名空间。
namespace: shortlink-operator-system

# 这个字段的值会加在所有资源名字的前面，例如
# 一个叫 "wordpress" 的 deployment 会变成 "alices-wordpress"。
# 注意它还应与上面 namespace 字段的前缀（'-' 之前那段文字）保持一致。
namePrefix: shortlink-operator-

# 要加到所有资源与选择器上的标签。
#labels:
#- includeSelectors: true
#  pairs:
#    someName: someValue

resources:
- ../crd
- ../rbac
- ../manager
# [WEBHOOK] 要启用 webhook，就把所有带 [WEBHOOK] 前缀的段落（包括
# crd/kustomization.yaml 里那一处）取消注释
#- ../webhook
# [CERTMANAGER] 要启用 cert-manager，就把所有带 'CERTMANAGER' 的段落取消注释。前提是 'WEBHOOK' 那些组件已启用。
#- ../certmanager
# [PROMETHEUS] 要启用 prometheus 采集，就把所有带 'PROMETHEUS' 的段落取消注释。
#- ../prometheus
# [METRICS] 把 controller manager 的 metrics 服务暴露出去。
- metrics_service.yaml
# [NETWORK POLICY] 控制进入 metrics 与 webhook 端口的来访流量。
# 允许打了 'metrics: enabled' 标签的命名空间里的 Pod 拉取指标。
# 允许任意来源的 webhook 流量。
#- ../network-policy

# 启用 Metrics 后就把下面 patches 这一行的注释取消
patches:
# [METRICS] 下面这个 patch 会用 HTTPS 暴露 metrics 端点，端口 :8443。
# 详情见：https://book.kubebuilder.io/reference/metrics
- path: manager_metrics_patch.yaml
  target:
    kind: Deployment

# 同时启用 Metrics 与 CertManager 时，就把 patches 这一行的注释取消
# [METRICS-WITH-CERTS] 要让 certManager 保护 metrics，就取消下面这一行的注释。
# 这个 patch 会用 certManager 的自签证书保护 metrics。
#- path: cert_metrics_manager_patch.yaml
#  target:
#    kind: Deployment

# [WEBHOOK] 要启用 webhook，就把所有带 [WEBHOOK] 前缀的段落（包括
# crd/kustomization.yaml 里那一处）取消注释
#- path: manager_webhook_patch.yaml
#  target:
#    kind: Deployment


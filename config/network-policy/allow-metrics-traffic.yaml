# 允许打了 'metrics: enabled' 标签的命名空间里的 Pod 拉取 metrics 流量。
# 想让某个命名空间里的 Pod 能抓指标，就给它打上这个标签。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/name: shortlink-operator
    app.kubernetes.io/managed-by: kustomize
  name: allow-metrics-traffic
  namespace: system
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: shortlink-operator
  policyTypes:
    - Ingress
  ingress:
    # 允许打了 'metrics: enabled' 标签的命名空间里的 Pod 来抓指标。
    - from:
      - namespaceSelector:
          matchLabels:
            metrics: enabled  # 只接受带这个标签的命名空间
      ports:
        - port: 8443
          protocol: TCP

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - shortlink.dev
  resources:
  - shortlinks
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - shortlink.dev
  resources:
  - shortlinks/finalizers
  verbs:
  - update
- apiGroups:
  - shortlink.dev
  resources:
  - shortlinks/status
  verbs:
  - get
  - patch
  - update

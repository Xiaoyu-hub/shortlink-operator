# 本项目（shortlink-operator）自身并不使用这条规则。
# 它只是提供给集群管理员，方便管理员为用户分配权限。
#
# 授予 shortlink.dev 下的全部权限（'*'）。
# 这个角色给的是「有权改集群里的角色与绑定」的那批人，
# 让他们可以按需把具体权限再委托给其他用户或用户组。

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: shortlink-operator
    app.kubernetes.io/managed-by: kustomize
  name: shortlink-admin-role
rules:
- apiGroups:
  - shortlink.dev
  resources:
  - shortlinks
  verbs:
  - '*'
- apiGroups:
  - shortlink.dev
  resources:
  - shortlinks/status
  verbs:
  - get

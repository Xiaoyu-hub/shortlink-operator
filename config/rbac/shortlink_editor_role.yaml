# 本项目（shortlink-operator）自身并不使用这条规则。
# 它只是提供给集群管理员，方便管理员为用户分配权限。
#
# 授予 shortlink.dev 下创建、更新、删除资源的权限。
# 这个角色给的是需要管理这些资源、
# 但不应控制 RBAC、也不应为别人分配权限的人。

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: shortlink-operator
    app.kubernetes.io/managed-by: kustomize
  name: shortlink-editor-role
rules:
- apiGroups:
  - shortlink.dev
  resources:
  - shortlinks
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - shortlink.dev
  resources:
  - shortlinks/status
  verbs:
  - get

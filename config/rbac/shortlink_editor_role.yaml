# This rule is not used by the project shortlink-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the shortlink.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: shortlink-operator
    app.kubernetes.io/managed-by: kustomize
  name: shortlink-editor-role
rules:
- apiGroups:
  - shortlink.dev
  resources:
  - shortlinks
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - shortlink.dev
  resources:
  - shortlinks/status
  verbs:
  - get

# 本项目（shortlink-operator）自身并不使用这条规则。
# 它只是提供给集群管理员，方便管理员为用户分配权限。
#
# 对 shortlink.dev 资源只读。
# 这个角色给的是需要看到这些资源、
# 但没有修改权限的人。适合监控场景和只读查看。

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: shortlink-operator
    app.kubernetes.io/managed-by: kustomize
  name: shortlink-viewer-role
rules:
- apiGroups:
  - shortlink.dev
  resources:
  - shortlinks
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - shortlink.dev
  resources:
  - shortlinks/status
  verbs:
  - get
